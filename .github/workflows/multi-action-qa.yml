name: Multi-action AI chat QA

# On-demand proof that one chat message with 5/10/20 discrete actions executes
# end-to-end (AI -> tools -> DB -> REST read-back -> fresh-session refresh)
# against a real deployment. Runs from a GitHub runner because the authoring
# environment's egress policy blocks *.vercel.app preview URLs.
#
# This suite mutates a dedicated live account, so it remains manual-only.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "API base to test (default: https://portol.me/api)"
        required: false
env:
  TARGET_API_BASE: ${{ github.event.inputs.api_base || 'https://portol.me/api' }}

jobs:
  multi-action-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Wait for the target deployment of this commit
        run: |
          target_origin="${TARGET_API_BASE%/api}"
          echo "Waiting for $target_origin to serve sha=$GITHUB_SHA"
          for i in $(seq 1 40); do
            body=$(curl -sS --max-time 20 "$target_origin/api/version" || echo "")
            echo "poll $i: $body"
            if echo "$body" | grep -q "$GITHUB_SHA"; then
              echo "Target is live on this commit."
              exit 0
            fi
            sleep 15
          done
          echo "Target never reached this commit; refusing to test an unknown deployment." >&2
          exit 1

      - name: Run 5/10/20-action verification suite
        env:
          SMOKE_API_BASE: ${{ env.TARGET_API_BASE }}
        run: npx tsx scripts/verify-multi-action.ts
