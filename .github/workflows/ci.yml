name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      # Same gate as .githooks/pre-push stage (0/2), so a new advisory fails the
      # build on a PR instead of ambushing the next person at push time. Runs
      # before tsc: a vulnerable tree should not consume a build.
      - name: Dependency audit (high+ severity, runtime deps)
        run: npm run audit:ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # Local-only unit/component/route-harness tests. Production-mutating
      # contract and live suites have dedicated configs and are not run here.
      - name: Unit and component tests
        run: npm test
      
      - name: Build
        run: npx tsx script/build-vercel.ts
        env:
          NODE_ENV: production
