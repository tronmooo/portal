name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, with no push: a new security advisory, a retired runtime or a
  # dependency that broke under us shows up here instead of ambushing the next
  # person who pushes (2026-10-09: Node 20 was retired and nobody knew).
  schedule:
    - cron: "41 13 * * 1"
  workflow_dispatch:

jobs:
  # Its own job, not a step in front of the build: from 2026-11-11 two high
  # advisories (zod, katex — both need a major upgrade) failed this step, and
  # because it ran first, the type check, the tests and the build below never
  # ran on main at all. An advisory must be loud; it must not switch the other
  # gates off.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Same gate as .githooks/pre-push stage (0/2).
      - name: Dependency audit (high+ severity, runtime deps)
        run: npm run audit:ci

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # Local-only unit/component/route-harness tests. Production-mutating
      # contract and live suites have dedicated configs and are not run here.
      - name: Unit and component tests
        run: npm test
      
      - name: Build
        run: npx tsx script/build-vercel.ts
        env:
          NODE_ENV: production
