name: Integrity (deployed app)

# The integrity run (tests/integrity): every scenario performs an action as the
# smoke account and then checks the stored row in Postgres, the figures that
# depend on it against an independent calculation, and — for the browser
# scenarios — the screens, on desktop and phone, without a reload. A scenario
# that only saw a success answer is INCOMPLETE, never PASS.
#
# Runs after every production deploy (once "Production serves main" has
# confirmed the new commit is live), every night, and on demand. The local
# half — the model guard, the randomized oracle properties and the guards for
# past findings — is part of `npm test`, which CI runs on every push and PR.
#
# A red run opens (or updates) one issue with the failed scenarios, their
# reproduction steps and screenshots; a green run closes it.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Scenario id pattern (regex); empty = all"
        required: false
      seed:
        description: "Random seed (empty = today's)"
        required: false
  workflow_run:
    workflows: ["Production serves main"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 10 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: integrity
  cancel-in-progress: false

jobs:
  integrity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Browser for the screen scenarios
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Integrity run against portol.me
        id: run
        env:
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          INTEGRITY_OTHER_EMAIL: ${{ secrets.INTEGRITY_OTHER_EMAIL }}
          INTEGRITY_OTHER_PASSWORD: ${{ secrets.INTEGRITY_OTHER_PASSWORD }}
          ONLY: ${{ github.event.inputs.only }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          set +e
          npx tsx tests/integrity/run.ts ${ONLY:+--only "$ONLY"} ${SEED:+--seed "$SEED"}
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Report
        if: always()
        run: |
          npx tsx scripts/gen-integrity-report.ts || true
          cp docs/INTEGRITY_REPORT.md test-results/integrity/ 2>/dev/null || true
          cat docs/INTEGRITY_REPORT.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: integrity-results
          path: test-results/integrity/
          retention-days: 30
      - name: Open or close the integrity issue
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const title = 'Integrity run is failing on production';
            const failed = '${{ steps.run.outputs.exit }}' !== '0';
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'integrity' });
            const existing = open.find((i) => i.title === title);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (!failed) {
              if (existing) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Green again: ${url}` });
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
              }
              return;
            }
            let body = `The integrity run failed: ${url}\n\nResults, reproduction steps and screenshots are in the run's \`integrity-results\` artifact.\n`;
            try {
              const r = JSON.parse(fs.readFileSync('test-results/integrity/results.json', 'utf8'));
              const bad = r.results.filter((x) => ['fail', 'error', 'incomplete'].includes(x.status));
              body += `\nCommit ${r.sha}, seed ${r.seed}.\n\n` + bad.map((x) => `- **${x.status}** \`${x.id}\` — ${x.title}\n` + x.checks.filter((c) => !c.ok).slice(0, 5).map((c) => `  - [${c.kind}] ${c.what}${c.detail ? ` — ${String(c.detail).slice(0, 200)}` : ''}`).join('\n') + (x.error ? `\n  - ${String(x.error).split('\n')[0].slice(0, 200)}` : '') + `\n  - rerun: \`npx tsx tests/integrity/run.ts --only '^${x.id}$' --seed ${r.seed}\``).join('\n');
            } catch (e) { body += `\n(no results.json: the run stopped before writing it)`; }
            if (existing) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['integrity'] });
      - name: Fail the job when the run failed
        if: steps.run.outputs.exit != '0'
        run: exit 1
